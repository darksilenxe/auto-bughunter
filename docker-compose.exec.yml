# Override layer enabling exec-mode tool execution (USE_HTTP_TOOL_SERVICES=false).
#
# In exec mode the backend invokes tools via `docker compose exec -T <svc> <tool>`,
# which requires:
#   * the docker-cli to be available inside the backend container, and
#   * the host's Docker socket to be bind-mounted into the backend container, and
#   * the compose file to be readable inside the backend container so the shims
#     can resolve service names.
#
# The Docker socket is root-equivalent on the host; it is intentionally NOT
# mounted by the default compose file. Layer this override only when you
# explicitly want exec-mode behavior (and accept the security trade-off):
#
#     docker compose -f docker-compose.yml -f docker-compose.exec.yml up
#
# In the default HTTP mode (USE_HTTP_TOOL_SERVICES=true, see .env.example), the
# backend talks to nuclei-service:8093, zap-service:8094, etc. and this
# override is unnecessary.

services:
  backend:
    environment:
      USE_HTTP_TOOL_SERVICES: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro

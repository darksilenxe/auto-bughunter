name: Ensure Repo Labels

# Ensures repo-managed labels (e.g. `run-e2e`) exist so that maintainers can
# apply them to PRs without having to manually create the label first.
#
# The `run-e2e` label is consumed by `e2e-juice-shop.yml` to opt a PR into the
# heavy Juice Shop end-to-end harness; without this workflow that label has to
# be created by hand the first time it is used.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ensure-labels.yml

permissions:
  issues: write

jobs:
  ensure-labels:
    name: Ensure labels exist
    runs-on: ubuntu-latest
    steps:
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # name|color (no leading #)|description
          labels=(
            "run-e2e|BFD4F2|Opt this PR into the heavy Juice Shop E2E harness"
          )
          for entry in "${labels[@]}"; do
            IFS='|' read -r name color description <<< "$entry"
            if gh label list --limit 200 --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "[=] label '$name' already exists, updating color/description"
              gh label edit "$name" --color "$color" --description "$description"
            else
              echo "[+] creating label '$name'"
              gh label create "$name" --color "$color" --description "$description"
            fi
          done

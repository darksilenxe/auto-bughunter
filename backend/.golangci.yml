# golangci-lint configuration for the auto-bughunter backend.
# Run locally with: golangci-lint run ./...
run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

linters-settings:
  errcheck:
    # The codebase intentionally ignores errors from response writes,
    # logging, and best-effort cleanup; flagging every one would create
    # noise for no security or correctness benefit.
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (*encoding/json.Encoder).Encode
      - fmt.Fprintf
      - fmt.Fprintln
      - (*database/sql.Rows).Close
      - (*os.File).Close

issues:
  exclude-rules:
    # Test helpers often shadow err and re-assign in loops; tolerated there.
    - path: _test\.go
      linters: [errcheck, ineffassign]
  max-issues-per-linter: 0
  max-same-issues: 0

services:
  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_DB: autobughunter
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: auto
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:

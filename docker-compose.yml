services:
  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_DB: autobughunter
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: auto
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto -d autobughunter"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ml-service:
    build:
      context: ./ml-service
    environment:
      MODEL_PATH: ${ML_MODEL_PATH:-}
      SIDECAR_AUTH_TOKEN: ${SIDECAR_AUTH_TOKEN:-}
    ports:
      - "8090:8090"
    volumes:
      - ./ml-service/models:/models:ro

  # Autonomous agent learner — hosts the neural Q-learning model that teaches
  # itself which agent sequences produce the best findings over time.
  agents:
    build:
      context: ./agents
    environment:
      WEIGHTS_PATH: /data/agent_weights.json
      LOG_LEVEL: ${AGENTS_LOG_LEVEL:-INFO}
      SIDECAR_AUTH_TOKEN: ${SIDECAR_AUTH_TOKEN:-}
    ports:
      - "8091:8091"
    volumes:
      - agents_data:/data

  # Local Ollama LLM — powers AI summaries without any external API key.
  # On first start it will download the configured model (~2 GB for phi3:mini).
  # Gated behind the `ollama` compose profile so it doesn't start by default
  # (e.g. in CI or for users who don't want the model download). Enable with:
  #   docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Pull the default model on startup so the backend can use it immediately.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
    entrypoint: /bin/sh -c "sleep 5 && ollama pull $${OLLAMA_MODEL:-phi3:mini}"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8081:8081"
    # The backend image is now slim — it shells out to per-tool sidecars
    # (zap, nuclei, chromium, projectdiscovery, ffuf, gobuster, sqlmap,
    # nikto, wpscan) via the shim scripts under /usr/local/bin/. Mounting
    # the host docker socket lets those shims call
    # `docker compose exec -T <svc> <tool>` from inside the backend
    # container.
    #
    # The backend remains the single orchestrator: it is the only service
    # that talks to the docker socket and the only service that talks to
    # the `agents` and `ml-service` HTTP sidecars. No sidecar talks to
    # another sidecar directly.
    #
    # Security note: docker-socket access is effectively root-equivalent on
    # the host. Acceptable for self-hosted scanner usage; not recommended in
    # multi-tenant deployments. To opt out, set SIDECAR_EXEC_DISABLE=1 — the
    # scanner will then report the standard `<tool>-binary-missing` finding
    # for each affected integration.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared scratch dir used to hand wordlist files to the ffuf/gobuster
      # sidecars. Mounted at the same path inside both backend and the
      # consumer sidecars so `-w <path>` resolves identically on both
      # sides. Backed by a named volume so it survives container restarts
      # but stays isolated from the host filesystem.
      - shared_tmp:/tmp/auto-bughunter-shared
    environment:
      CHROME_REMOTE_URL: ${CHROME_REMOTE_URL:-http://chromium:9222}
      SHARED_TMP_DIR: /tmp/auto-bughunter-shared
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
      agents:
        condition: service_started
      zap:
        condition: service_started
      nuclei:
        condition: service_started
      chromium:
        condition: service_started
      projectdiscovery:
        condition: service_started
      ffuf:
        condition: service_started
      gobuster:
        condition: service_started
      sqlmap:
        condition: service_started
      nikto:
        condition: service_started
      wpscan:
        condition: service_started

  # ------------------------------------------------------------------
  # Tool sidecars — one container per heavy security dependency. The
  # backend reaches each one via its shim under /usr/local/bin (e.g.
  # `nuclei`, `zap-baseline.py`).
  # ------------------------------------------------------------------

  # OWASP ZAP daemon. Ships zap-baseline.py and all of its Python
  # dependencies on $PATH, so the backend's zap-baseline.py shim just
  # `docker compose exec`s into here.
  zap:
    image: zaproxy/zap-stable:2.17.0
    # `tail -f /dev/null` keeps the container alive so `exec` works. The
    # daemon is started on demand by zap-baseline.py itself.
    entrypoint: ["/bin/sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  # Nuclei vulnerability scanner. Same pattern — kept alive so the
  # backend can `docker compose exec -T nuclei nuclei ...`.
  nuclei:
    image: projectdiscovery/nuclei:v3.7.1
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    volumes:
      - nuclei_templates:/root/nuclei-templates
    restart: unless-stopped

  # Headless Chromium exposing the DevTools protocol on 9222. The Go
  # scanner attaches to this remote browser via chromedp.NewRemoteAllocator
  # when CHROME_REMOTE_URL is set (see backend/internal/scanner/browser.go).
  chromium:
    image: chromedp/headless-shell:latest
    # --no-sandbox is required because the image runs as root; the
    # headless-shell entrypoint already wires up --remote-debugging-port.
    command:
      - --no-sandbox
      - --disable-gpu
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
    restart: unless-stopped

  # Shared ProjectDiscovery suite. A single sidecar built locally that
  # bundles subfinder, httpx, naabu, dnsx, shuffledns, katana, tlsx,
  # cdncheck and asnmap by COPYing each binary out of its official
  # upstream image. The matching shims under backend/scripts/shims/
  # `docker compose exec`s the right tool by name.
  projectdiscovery:
    build:
      context: ./sidecars/projectdiscovery
    entrypoint: ["/bin/sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  # Web fuzzing — ffuf. The backend writes a temporary wordlist into
  # the shared_tmp volume; ffuf consumes it via the same path.
  ffuf:
    image: ghcr.io/ffuf/ffuf:v2.1.0
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    volumes:
      - shared_tmp:/tmp/auto-bughunter-shared:ro
    restart: unless-stopped

  # Directory brute-forcing — gobuster. Same shared-volume pattern as ffuf.
  gobuster:
    image: ghcr.io/oj/gobuster:v3.6.0
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    volumes:
      - shared_tmp:/tmp/auto-bughunter-shared:ro
    restart: unless-stopped

  # SQL injection probe (Python). Keeps the Python runtime out of the
  # backend image entirely.
  sqlmap:
    image: paoloo/sqlmap:latest
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  # Nikto web server scanner (Perl).
  nikto:
    image: sullo/nikto:latest
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  # WPScan WordPress scanner (Ruby).
  wpscan:
    image: wpscanteam/wpscan:latest
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["webui"]
    ports:
      - "3001:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  db_data:
  ollama_data:
  openwebui_data:
  agents_data:
  nuclei_templates:
  shared_tmp:


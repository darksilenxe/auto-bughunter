services:
  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_DB: autobughunter
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: auto
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  ml-service:
    build:
      context: ./ml-service
    environment:
      MODEL_PATH: ${ML_MODEL_PATH:-}
    ports:
      - "8090:8090"
    volumes:
      - ./ml-service/models:/models:ro

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
      - ml-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["ai"]
    ports:
      - "3001:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  db_data:
  ollama_data:
  openwebui_data:

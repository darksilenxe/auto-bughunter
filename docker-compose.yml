services:
  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_DB: autobughunter
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: auto
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto -d autobughunter"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ml-service:
    build:
      context: ./ml-service
    environment:
      MODEL_PATH: ${ML_MODEL_PATH:-}
    ports:
      - "8090:8090"
    volumes:
      - ./ml-service/models:/models:ro

  # Autonomous agent learner — hosts the neural Q-learning model that teaches
  # itself which agent sequences produce the best findings over time.
  agents:
    build:
      context: ./agents
    environment:
      WEIGHTS_PATH: /data/agent_weights.json
      LOG_LEVEL: ${AGENTS_LOG_LEVEL:-INFO}
    ports:
      - "8091:8091"
    volumes:
      - agents_data:/data

  # Local Ollama LLM — powers AI summaries without any external API key.
  # On first start it will download the configured model (~2 GB for phi3:mini).
  # Gated behind the `ollama` compose profile so it doesn't start by default
  # (e.g. in CI or for users who don't want the model download). Enable with:
  #   docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Pull the default model on startup so the backend can use it immediately.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
    entrypoint: /bin/sh -c "sleep 5 && ollama pull $${OLLAMA_MODEL:-phi3:mini}"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
      agents:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["webui"]
    ports:
      - "3001:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  db_data:
  ollama_data:
  openwebui_data:
  agents_data:


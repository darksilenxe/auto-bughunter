name: auto-bughunter

services:
  db:
    # pgvector/pgvector includes the vector extension required by episodic
    # cross-scan memory.  The image is a drop-in replacement for postgres:16.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: autobughunter
      POSTGRES_USER: auto
      POSTGRES_PASSWORD: auto
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auto -d autobughunter"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5.26.1
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4jpass}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ml-service:
    build:
      context: ./ml-service
    environment:
      MODEL_PATH: ${ML_MODEL_PATH:-}
      SIDECAR_AUTH_TOKEN: ${SIDECAR_AUTH_TOKEN:-}
    ports:
      - "8090:8090"
    volumes:
      - ./ml-service/models:/models:ro

  security-knowledge:
    build:
      context: ./security-knowledge
    environment:
      SIDECAR_AUTH_TOKEN: ${SIDECAR_AUTH_TOKEN:-}
      KNOWLEDGE_CORPUS_PATH: /app/data/corpus.json
    ports:
      - "8092:8092"

  # Autonomous agent learner — hosts the neural Q-learning model that teaches
  # itself which agent sequences produce the best findings over time.
  agents:
    build:
      context: ./agents
    environment:
      WEIGHTS_PATH: /data/agent_weights.json
      LOG_LEVEL: ${AGENTS_LOG_LEVEL:-INFO}
      SIDECAR_AUTH_TOKEN: ${SIDECAR_AUTH_TOKEN:-}
    ports:
      - "8091:8091"
    volumes:
      - agents_data:/data

  # Nuclei HTTP wrapper service — eliminates Docker socket requirement by
  # exposing nuclei via HTTP instead of `docker compose exec`.
  nuclei-service:
    build:
      context: ./sidecars/nuclei-service
    environment:
      SIDECAR_AUTH_TOKEN: ${SIDECAR_AUTH_TOKEN:-}
      LOG_LEVEL: ${NUCLEI_SERVICE_LOG_LEVEL:-INFO}
    ports:
      - "8093:8093"
    volumes:
      - nuclei_templates:/root/nuclei-templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8093/health\", timeout=2).raise_for_status()' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ZAP Baseline HTTP wrapper service — eliminates Docker socket requirement by
  # exposing zap-baseline.py via HTTP instead of `docker compose exec`.
  zap-service:
    build:
      context: ./sidecars/zap-service
    environment:
      SIDECAR_AUTH_TOKEN: ${SIDECAR_AUTH_TOKEN:-}
      LOG_LEVEL: ${ZAP_SERVICE_LOG_LEVEL:-INFO}
    ports:
      - "8094:8094"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8094/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Local Ollama LLM — powers AI summaries without any external API key.
  # On first start it will download the configured models (~4 GB for dolphin-mistral).
  # Gated behind the `ollama` compose profile so it doesn't start by default
  # (e.g. in CI or for users who don't want the model download). Enable with:
  #   docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Pull default local models on startup so the backend can use them immediately.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-dolphin-mistral}
      OLLAMA_SECONDARY_MODEL: ${OLLAMA_SECONDARY_MODEL:-codellama}
    entrypoint: /bin/sh -c "sleep 5 && primary=$${OLLAMA_MODEL:-dolphin-mistral} && secondary=$${OLLAMA_SECONDARY_MODEL:-codellama} && if [ -n \"$$primary\" ]; then ollama pull \"$$primary\"; fi && if [ -n \"$$secondary\" ] && [ \"$$secondary\" != \"$$primary\" ]; then ollama pull \"$$secondary\"; fi"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
      - "8081:8081"
    # The backend can communicate with tool sidecars in two modes:
    #
    # 1. HTTP mode (USE_HTTP_TOOL_SERVICES=true): Tools expose HTTP endpoints
    #    (e.g., nuclei-service:8093). No Docker socket required. Secure and
    #    production-ready.
    #
    # 2. Exec mode (USE_HTTP_TOOL_SERVICES=false, default): Shim scripts call
    #    `docker compose exec -T <svc> <tool>` using the Docker socket. Requires
    #    docker-cli in backend image and socket mount below.
    #
    # The backend remains the single orchestrator: it is the only service that
    # talks to tool sidecars. No sidecar talks to another sidecar directly.
    #
    # Security note (exec mode only): Docker socket access is root-equivalent on
    # the host. Acceptable for self-hosted scanner usage; not recommended in
    # multi-tenant deployments. HTTP mode eliminates this requirement entirely.
    volumes:
      # Docker socket - ONLY needed when USE_HTTP_TOOL_SERVICES=false
      # Comment out these two lines when using HTTP mode:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      # Shared scratch dir used to hand wordlist files to the ffuf/gobuster
      # sidecars. Mounted at the same path inside both backend and the
      # consumer sidecars so `-w <path>` resolves identically on both
      # sides. Backed by a named volume so it survives container restarts
      # but stays isolated from the host filesystem.
      - shared_tmp:/tmp/auto-bughunter-shared
      # Read-only view of the Assetnote wordlist cache populated by the
      # `kiterunner` sidecar. Mounted at the same path inside backend and
      # the consumer sidecars (ffuf, gobuster, kiterunner) so paths in
      # `-w /wordlists/...` arguments resolve identically on every side.
      - assetnote_wordlists:/wordlists:ro
      # Read-only view of the latest software-update report produced by
      # the `tool-updater` sidecar on every `docker compose up`. Surfaced
      # via `GET /api/tools/updates`.
      - tool_updates:/var/lib/auto-bughunter/updates:ro
    environment:
      CHROME_REMOTE_URL: ${CHROME_REMOTE_URL:-http://chromium:9222}
      SHARED_TMP_DIR: /tmp/auto-bughunter-shared
      ASSETNOTE_WORDLIST_DIR: /wordlists
      TOOL_UPDATES_REPORT_PATH: /var/lib/auto-bughunter/updates/report.json
      # Tell docker compose (used by sidecar-exec shims) where to find the
      # compose file and which project name to use when exec-ing into sidecars.
      COMPOSE_FILE: /app/docker-compose.yml
      # Metasploit RPC — set MSF_RPC_URL and MSF_RPC_PASSWORD to enable live
      # Metasploit module execution. Leave MSF_RPC_URL empty to run only the
      # built-in native Go web exploit probes (no msfrpcd required).
      MSF_RPC_URL: ${MSF_RPC_URL:-}
      MSF_RPC_PASSWORD: ${MSF_RPC_PASSWORD:-}
      # Burp Suite Enterprise REST API — set BURP_API_URL and BURP_API_KEY to
      # trigger a Burp Suite Enterprise active scan in addition to the native
      # Go active-scan checks. Leave empty to run only the built-in checks.
      BURP_API_URL: ${BURP_API_URL:-}
      BURP_API_KEY: ${BURP_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ml-service:
        condition: service_started
      security-knowledge:
        condition: service_started
      agents:
        condition: service_started
      nuclei-service:
        condition: service_healthy
      zap-service:
        condition: service_healthy
      zap:
        condition: service_started
      nuclei:
        condition: service_started
      chromium:
        condition: service_healthy
      projectdiscovery:
        condition: service_started
      ffuf:
        condition: service_started
      gobuster:
        condition: service_started
      sqlmap:
        condition: service_started
      nikto:
        condition: service_started
      wpscan:
        condition: service_started
      xssmap:
        condition: service_started
      metasploit:
        condition: service_started
      kiterunner:
        condition: service_started
      # tool-updater is a one-shot service; we wait for it to *finish* so
      # nuclei templates are guaranteed up-to-date and the update report
      # is on disk before the backend starts serving /api/tools/updates.
      tool-updater:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # Tool sidecars — one container per heavy security dependency. The
  # backend reaches each one via its shim under /usr/local/bin (e.g.
  # `nuclei`, `zap-baseline.py`).
  # ------------------------------------------------------------------

  # OWASP ZAP daemon. Ships zap-baseline.py and all of its Python
  # dependencies on $PATH, so the backend's zap-baseline.py shim just
  # `docker compose exec`s into here.
  zap:
    image: zaproxy/zap-stable:2.17.0
    # `tail -f /dev/null` keeps the container alive so `exec` works. The
    # daemon is started on demand by zap-baseline.py itself.
    entrypoint: ["/bin/sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped
    # The upstream image ships a HEALTHCHECK that verifies the ZAP daemon is
    # running. Because we override the entrypoint to keep the container alive
    # for `docker compose exec` without starting the daemon, that check would
    # always fail. Disable it so the container stays healthy.
    healthcheck:
      disable: true

  # Nuclei vulnerability scanner. Same pattern — kept alive so the
  # backend can `docker compose exec -T nuclei nuclei ...`.
  nuclei:
    image: projectdiscovery/nuclei:v3.8.0
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    volumes:
      - nuclei_templates:/root/nuclei-templates
    restart: unless-stopped

  # Headless Chromium exposing the DevTools protocol on 9222. The Go
  # scanner attaches to this remote browser via chromedp.NewRemoteAllocator
  # when CHROME_REMOTE_URL is set (see backend/internal/scanner/browser.go).
  chromium:
    image: chromedp/headless-shell:latest
    # The image entrypoint (run.sh) already passes --no-sandbox,
    # --remote-debugging-address=0.0.0.0, and --remote-debugging-port=9223
    # to headless-shell, and runs socat to forward host port 9222 → 9223.
    # Only pass flags not already set by the entrypoint to avoid conflicts.
    command:
      - --disable-gpu
    restart: unless-stopped
    healthcheck:
      # Probe the DevTools port via socat (wget/curl are not in this image).
      # socat is already present in chromedp/headless-shell for the port
      # forwarding shim, so this avoids any extra dependency.
      test: ["CMD-SHELL", "socat -u /dev/null TCP4:localhost:9222 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Shared ProjectDiscovery suite. A single sidecar built locally that
  # bundles subfinder, httpx, naabu, dnsx, shuffledns, katana, tlsx,
  # cdncheck and asnmap by COPYing each binary out of its official
  # upstream image. The matching shims under backend/scripts/shims/
  # `docker compose exec`s the right tool by name.
  projectdiscovery:
    build:
      context: ./sidecars/projectdiscovery
    entrypoint: ["/bin/sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  # Web fuzzing — ffuf. The backend writes a temporary wordlist into
  # the shared_tmp volume; ffuf consumes it via the same path. Also gets
  # the Assetnote wordlist cache (read-only) so the backend can hand off
  # paths like `/wordlists/<category>/<file>` directly.
  #
  # Image note: there is no upstream `ghcr.io/ffuf/ffuf` image (registry
  # returns "denied" — see Juice Shop CI run #11). The `secsi/ffuf` image
  # on Docker Hub is the most widely used community image and tracks the
  # ffuf release tags 1:1.
  ffuf:
    image: secsi/ffuf:2.1.0
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    volumes:
      - shared_tmp:/tmp/auto-bughunter-shared:ro
      - assetnote_wordlists:/wordlists:ro
    restart: unless-stopped

  # Directory brute-forcing — gobuster. Same shared-volume pattern as ffuf.
  gobuster:
    image: ghcr.io/oj/gobuster@sha256:244e4b3b59c6c92f9344bfc39d9f35a7fc209da84d045ba10fbb9800408728d2
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    volumes:
      - shared_tmp:/tmp/auto-bughunter-shared:ro
      - assetnote_wordlists:/wordlists:ro
    restart: unless-stopped

  # Kiterunner (Assetnote `kr`) sidecar — bundles the `kr` API content
  # discovery CLI and pre-downloads every wordlist published at
  # https://wordlists.assetnote.io into the `assetnote_wordlists` named
  # volume on first start. The same volume is read-only mounted into the
  # backend, ffuf, and gobuster containers at /wordlists, so a single
  # cache services every fuzzing tool.
  kiterunner:
    build:
      context: ./sidecars/kiterunner
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    volumes:
      - assetnote_wordlists:/wordlists
    restart: unless-stopped

  # SQL injection probe (Python). Keeps the Python runtime out of the
  # backend image entirely. Pin by digest to avoid mutable-tag drift and
  # deprecated image manifest formats.
  sqlmap:
    image: parrotsec/sqlmap@sha256:c5922651223e33bc33b3225de4a494962101a32b0422cba3a247db2a1579f925
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  # Nikto web server scanner (Perl).
  nikto:
    image: ghcr.io/sullo/nikto@sha256:0bb37022ebfadc38d6a9a2755c03bfd1f9e079e01e8946fe548153d9ba0c2012
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  # WPScan WordPress scanner (Ruby).
  wpscan:
    image: wpscanteam/wpscan:v3.8.28
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped

  # XSSMap — third-party LLM-assisted XSS scanner
  # (https://github.com/Sh3llholic/XSSMap, GPL-3.0). Bundled as an external
  # tool only — its source is **not** vendored into this repository.
  #
  # Reuses the existing `ollama` sidecar via XSSMAP_OLLAMA_URL; the model
  # defaults to OLLAMA_MODEL which is already pre-pulled on container start.
  # Gated by ALLOW_DESTRUCTIVE_CHECKS in the backend because XSSMap actively
  # sends XSS payloads at the target.
  xssmap:
    build:
      context: ./sidecars/xssmap
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    environment:
      XSSMAP_OLLAMA_URL: ${XSSMAP_OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-dolphin-mistral}
      XSSMAP_TIMEOUT_SECONDS: ${XSSMAP_TIMEOUT_SECONDS:-120}
    restart: unless-stopped

  # Metasploit Framework — optional sidecar for running web exploit modules
  # via msfrpcd JSON-RPC. The container is kept alive with `tail -f /dev/null`;
  # start msfrpcd inside it to enable the RPC phase of the MetasploitAgent:
  #
  #   docker compose exec metasploit \
  #     msfrpcd -P "${MSF_RPC_PASSWORD}" -S false -a 0.0.0.0 -p 55553 -f
  #
  # Then set MSF_RPC_URL=http://metasploit:55553 and MSF_RPC_PASSWORD in the
  # backend environment. The MetasploitAgent's native Go probes run regardless
  # of whether msfrpcd is active.
  metasploit:
    image: metasploitframework/metasploit-framework:latest
    entrypoint: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped
    # msfrpcd listens on 55553 inside the compose network; no host-port
    # binding needed because the backend reaches it via the service name.
    expose:
      - "55553"

  # Tool-updater — one-shot container that runs on every `docker compose
  # up`. Refreshes the nuclei templates volume and queries GitHub Releases
  # for every pinned tool listed in sidecars/tool-updater/manifest.json,
  # writing a JSON report to the shared `tool_updates` volume. Surfaced
  # by the backend at `GET /api/tools/updates`.
  #
  # Manual re-run (without restarting the platform):
  #   docker compose run --rm tool-updater
  tool-updater:
    build:
      context: ./sidecars/tool-updater
    # One-shot: the container exits after writing the report. `restart`
    # is intentionally `no` so it doesn't loop.
    restart: "no"
    environment:
      # Optional: lift GitHub's 60 req/h unauth rate limit. Leave unset
      # in dev — the manifest currently has 16 entries, well under quota.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Set to 1 for offline / air-gapped boots.
      TOOL_UPDATER_SKIP_NUCLEI: ${TOOL_UPDATER_SKIP_NUCLEI:-0}
      TOOL_UPDATER_SKIP_VERSION: ${TOOL_UPDATER_SKIP_VERSION:-0}
    volumes:
      - nuclei_templates:/root/nuclei-templates
      - tool_updates:/var/lib/auto-bughunter/updates

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["webui"]
    ports:
      - "3001:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - openwebui_data:/app/backend/data

  # ---------------------------------------------------------------------------
  # Observability stack (opt-in, start with: docker compose --profile obs up)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.4
    profiles: ["obs"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.6.1
    profiles: ["obs"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  neo4j_data:
  ollama_data:
  openwebui_data:
  agents_data:
  nuclei_templates:
  shared_tmp:
  assetnote_wordlists:
  tool_updates:
  prometheus_data:
  grafana_data:
